version: 2

models:
  - name: stg_clients
    description: "Staging model for client demographic and status data."
    columns:
      - name: Client_ID
        description: "Unique client identifier."
        data_tests:
          - unique
          - not_null
      - name: Client_Name
        description: "Client organization name."
      - name: Industry
        description: "Client's industry sector."
      - name: City
        description: "Canadian city."
      - name: Province
        description: "Standardized Canadian province code."
      - name: Region
        description: "Canadian business region used for reporting."
      - name: Client_Size
        description: "Client size category: Small, Mid-Market, Enterprise."
      - name: Account_Manager_ID
        description: "Consultant responsible for the client relationship."
      - name: Client_Start_Date
        description: "Date the client relationship began."
      - name: Active_Status
        description: "Current client active/inactive status."

  - name: stg_clientcontractterms
    description: "Staging model for client payment terms and discount rules."
    columns:
      - name: Client_ID
        description: "Unique client identifier."
        data_tests:
          - unique
          - not_null
      - name: Payment_Terms_Days
        description: "Number of days after invoice date that payment is due."
      - name: Preferred_Invoice_Frequency
        description: "Typical billing frequency agreed with client."
      - name: Client_Priority
        description: "Client segment assigned by account team."
      - name: Default_Currency
        description: "Currency used for commercial records."

  - name: stg_consultants
    description: "Cleans consultant profile records, standardizes hire and termination dates, and backfills missing hourly cost and billing rates using default rates from seniority rate rules."
    columns:
      - name: Consultant_ID
        description: "Unique consultant identifier."
        data_tests:
          - unique
          - not_null
      - name: Consultant_Name
        description: "Consultant full name."
      - name: Home_Branch_ID
        description: "Consultant's home office branch identifier."
      - name: Service_Line_ID
        description: "Unique service line identifier."
      - name: Seniority
        description: "Consultant seniority level."
      - name: Hourly_Cost_Rate
        description: "Internal hourly delivery cost in CAD, coalesced with default rates if missing."
      - name: Standard_Bill_Rate
        description: "Default client billing rate in CAD, coalesced with default rates if missing."
      - name: Hire_Date
        description: "Consultant hire date cast to standard DATE format."
      - name: Termination_Date
        description: "Termination date cast to DATE format; null if active."
      - name: Employment_Status
        description: "Active or inactive employment status."

  - name: stg_clientfeedback
    description: "Cleans raw client feedback entries, standardizes key identifiers and dates, recalculates missing overall satisfaction scores from component averages, and derives client recommendation indicators."
    columns:
      - name: Feedback_ID
        description: "Unique feedback record identifier."
        data_tests:
          - unique
          - not_null
      - name: Project_ID
        description: "Standardized uppercase project identifier."
        data_tests:
          - not_null
      - name: Feedback_Date
        description: "Date client feedback was received."
      - name: Delivery_Quality_Score
        description: "Client rating from 1 to 5 for delivery quality."
      - name: Communication_Score
        description: "Client rating from 1 to 5 for communication."
      - name: Value_For_Money_Score
        description: "Client rating from 1 to 5 for overall value."
      - name: Overall_Satisfaction_Score
        description: "Overall satisfaction score; calculated as the average of component scores if null."
      - name: Would_Recommend
        description: "Derived recommendation classification: Yes (>= 4.0), Maybe (>= 3.5), or No."
        data_tests:
          - accepted_values:
              values: ['Yes', 'Maybe', 'No']

  - name: stg_projects
    description: "Cleans consulting project records, standardizes primary/foreign keys and project metadata, casts lifecycle dates, and derives missing project statuses based on completion and cancellation dates."
    columns:
      - name: Project_ID
        description: "Unique uppercase project identifier."
        data_tests:
          - unique
          - not_null
      - name: Client_ID
        description: "Unique uppercase client identifier."
        data_tests:
          - not_null
      - name: Service_Line_ID
        description: "Unique uppercase service line identifier."
      - name: Branch_ID
        description: "Unique uppercase office branch identifier."
      - name: Project_Manager_ID
        description: "Consultant managing project delivery."
      - name: Project_Name
        description: "Trimmed project name."
      - name: Project_Type
        description: "Commercial engagement structure type."
      - name: Start_Date
        description: "Project start date."
      - name: Planned_End_Date
        description: "Expected project completion date."
      - name: Actual_End_Date
        description: "Actual completion date; present for completed projects."
      - name: Cancellation_Date
        description: "Cancellation date; present for cancelled projects."
      - name: Cancellation_Reason
        description: "Nullified and trimmed cancellation reason."
      - name: Project_Status
        description: "Derived project status: Completed, Cancelled, or In Progress."
        data_tests:
          - accepted_values:
              values: ['Completed', 'Cancelled', 'In Progress']
      - name: Contract_Value_CAD
        description: "Signed contract value in CAD before tax."
      - name: Budgeted_Hours
        description: "Approved project budget hours."
      - name: Budgeted_Cost_CAD
        description: "Approved labour cost budget in CAD."
      - name: Initial_Risk_Level
        description: "Delivery risk assessment at project kickoff."

  - name: stg_payments
    description: "Cleans client payment records, standardizes payment and invoice primary/foreign keys, casts transaction dates, parses currency strings into numeric decimals, and trims payment metadata."
    columns:
      - name: Payment_ID
        description: "Unique uppercase payment identifier."
        data_tests:
          - unique
          - not_null
      - name: Invoice_ID
        description: "Uppercase invoice identifier linking to the billed invoice."
        data_tests:
          - not_null
      - name: Payment_Date
        description: "Date payment was processed."
      - name: Payment_Amount_CAD
        description: "Numeric payment amount in CAD stripped of currency symbols."
      - name: Payment_Method
        description: "Trimmed payment channel indicator."
      - name: Payment_Status
        description: "Processing status of the payment (e.g., Cleared)."

  - name: stg_taxrates
    description: "Cleans provincial tax rate reference data, standardizes provincial codes, trims province and tax names, and casts tax rates into standard decimal values."
    columns:
      - name: Province
        description: "Standardized uppercase 2-letter Canadian province code."
        data_tests:
          - unique
          - not_null
      - name: Province_Name
        description: "Trimmed full provincial name."
      - name: Tax_Name
        description: "Trimmed provincial tax designation (e.g., HST, GST/PST)."
      - name: Tax_Rate
        description: "Decimal representation of the provincial tax rate."

  - name: stg_invoices
    description: "Cleans invoice financial figures, standardizes primary and foreign keys, backfills missing provincial tax rates and amounts via client locations, and dynamically derives invoice payment statuses using cleared payment totals."
    columns:
      - name: Invoice_ID
        description: "Unique uppercase invoice identifier."
        data_tests:
          - unique
          - not_null
      - name: Project_ID
        description: "Uppercase project identifier."
      - name: Client_ID
        description: "Uppercase client identifier."
      - name: Invoice_Date
        description: "Date invoice was issued."
      - name: Due_Date
        description: "Payment due date."
      - name: Invoice_Subtotal_CAD
        description: "Numeric invoice subtotal before taxes in CAD."
      - name: Tax_Rate
        description: "Provincial tax rate applied; defaulted via client lookup if missing in source."
      - name: Tax_Amount_CAD
        description: "Tax amount in CAD; computed using lookup tax rate if missing in source."
      - name: Total_Invoice_Amount_CAD
        description: "Total invoice amount including tax in CAD."
      - name: Total_Amount_Paid
        description: "Sum of cleared payment amounts received against this invoice."
      - name: Invoice_Status
        description: "Derived status: Paid, Partially Paid - Overdue, Partially Paid, Overdue, or Open."
        data_tests:
          - accepted_values:
              values: ['Paid', 'Partially Paid - Overdue', 'Partially Paid', 'Overdue', 'Open']

  - name: stg_taskcategoryrules
    description: "Cleans task category lookup rules, standardizing task category descriptions and trimming flags for default billability and utilization tracking."
    columns:
      - name: Task_Category
        description: "Standardized task category name."
        data_tests:
          - unique
          - not_null
      - name: Default_Billable_Flag
        description: "Default billability classification: Billable or Non-Billable."
      - name: Include_In_Utilization
        description: "Flag indicating whether category hours count towards consultant utilization metrics."

  - name: stg_timesheets
    description: "Cleans timesheet entries, standardizes key identifiers and dates, casts logged hours to decimals, backfills missing billable flags using task category lookup rules, and deduplicates the final staging output."
    columns:
      - name: Timesheet_ID
        description: "Uppercase timesheet record identifier."
        data_tests:
          - not_null
      - name: Work_Date
        description: "Date work was performed."
      - name: Project_ID
        description: "Uppercase project identifier."
      - name: Consultant_ID
        description: "Uppercase consultant identifier."
      - name: Task_Category
        description: "Trimmed task category description."
      - name: Hours_Worked
        description: "Logged work duration cast to DECIMAL(5,1)."
      - name: Billable_Flag
        description: "Billable status; backfilled using default task category rules if missing."
      - name: Approved_Flag
        description: "Approval status of the timesheet entry."

  - name: stg_servicelines
    description: "Cleans service line reference data, standardizes service line identifiers, trims textual names and departments, and formats target margins, standard bill rates, and utilization percentages into standard decimal values."
    columns:
      - name: Service_Line_ID
        description: "Unique uppercase service line identifier."
        data_tests:
          - unique
          - not_null
      - name: Service_Line
        description: "Trimmed practice area name."
      - name: Department
        description: "Trimmed parent department name."
      - name: Target_Margin_Pct
        description: "Target profit margin formatted as DECIMAL(4,2)."
      - name: Standard_Bill_Rate
        description: "Default hourly billing rate in CAD formatted as DECIMAL(10,2)."
      - name: Target_Utilization_Pct
        description: "Target utilization rate formatted as DECIMAL(4,2)."

  - name: stg_seniorityraterules
    description: "Cleans seniority rate lookup rules, standardizes service line identifiers and seniority titles, and formats default hourly cost and bill rates into standard decimal values."
    columns:
      - name: Service_Line_ID
        description: "Uppercase service line identifier."
        data_tests:
          - not_null
      - name: Seniority
        description: "Consultant seniority level."
        data_tests:
          - not_null
      - name: Default_Hourly_Cost_Rate
        description: "Default hourly cost rate in CAD."
      - name: Default_Bill_Rate
        description: "Default hourly bill rate in CAD."

  - name: stg_senioritylevels
    description: "Cleans seniority level reference data, standardizes seniority text fields, formats cost and billing rate multipliers, and casts expected annual available hours to integers."
    columns:
      - name: Seniority
        description: "Trimmed seniority level name."
        data_tests:
          - unique
          - not_null
      - name: Cost_Multiplier
        description: "Cost multiplier for seniority tier."
      - name: Bill_Rate_Multiplier
        description: "Bill rate multiplier for seniority tier."
      - name: Expected_Annual_Available_Hours
        description: "Target available working hours per year cast as INTEGER."

  - name: stg_provincemap
    description: "Normalizes raw provincial names and variations to full province labels and standardizes target provincial ISO codes."
    columns:
      - name: Raw_Province_Value
        description: "Standardized province name mapped from raw variations."
        data_tests:
          - not_null
      - name: Standard_Province
        description: "Uppercase 2-letter Canadian province code."
        data_tests:
          - not_null

  - name: stg_projectassignments
    description: "Cleans consultant project allocation records, standardizes assignment, project, and consultant identifiers, casts lifecycle assignment dates, parses decimal allocations and billing rates, and normalizes assignment statuses."
    columns:
      - name: Assignment_ID
        description: "Unique uppercase assignment identifier."
        data_tests:
          - unique
          - not_null
      - name: Project_ID
        description: "Uppercase project identifier."
      - name: Consultant_ID
        description: "Uppercase consultant identifier."
      - name: Role_On_Project
        description: "Role title of consultant on project."
      - name: Assigned_Start_Date
        description: "Start date of the project assignment."
      - name: Assigned_End_Date
        description: "End date of the project assignment."
      - name: Allocation_Pct
        description: "Planned staff allocation percentage."
      - name: Bill_Rate_CAD
        description: "Hourly billing rate in CAD assigned for the engagement."
      - name: Assignment_Status
        description: "Normalized lowercase assignment status (e.g., active, closed)."

  - name: stg_locations
    description: "Cleans office branch records, standardizes branch identifiers and provincial codes, formats geographic and manager text fields, and casts office open dates to standard date format."
    columns:
      - name: Branch_ID
        description: "Unique uppercase office branch identifier."
        data_tests:
          - unique
          - not_null
      - name: City
        description: "Trimmed city name."
      - name: Province
        description: "Standardized uppercase 2-letter Canadian province code."
      - name: Region
        description: "Trimmed geographic reporting region."
      - name: Office_Open_Date
        description: "Date the office branch was established."
      - name: Branch_Manager
        description: "Trimmed name of the branch manager."
        